services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kabadiwala
      POSTGRES_PASSWORD: kabadiwala
      POSTGRES_DB: kabadiwala2connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabadiwala -d kabadiwala2connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://kabadiwala:kabadiwala@db:5432/kabadiwala2connect
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: ./uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
